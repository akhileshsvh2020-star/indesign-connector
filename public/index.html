<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>InDesign Connector</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="toolbar">
        <div>
          <p class="eyebrow">Adobe automation queue</p>
          <h1>InDesign Connector</h1>
        </div>
        <form id="uploadForm" class="upload-form">
          <label class="field-label" for="assignedTo">User</label>
          <select id="assignedTo" name="assignedTo" required></select>
          <input id="fileInput" name="file" type="file" accept="application/pdf,.pdf" required>
          <button type="submit">Upload job</button>
        </form>
      </section>

      <section class="status-grid">
        <article>
          <span id="queuedCount">0</span>
          <p>Queued</p>
        </article>
        <article>
          <span id="runningCount">0</span>
          <p>Running</p>
        </article>
        <article>
          <span id="doneCount">0</span>
          <p>Done</p>
        </article>
      </section>

      <section class="jobs-panel">
        <div class="panel-head">
          <h2>Jobs</h2>
          <button id="refreshButton" type="button">Refresh</button>
        </div>
        <div id="jobsList" class="jobs-list"></div>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
